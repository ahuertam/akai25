name: Deploy to GitHub Pages

# ---------------------------------------------------------------------------
# El sitio se publica con el deploy nativo de GitHub Pages (Actions), no
# haciendo push del build a una rama `gh-pages`.
#
# Motivo: la rama `gh-pages` contenía los 1,5 GB de sample packs en texto
# plano, así que un `git clone` del repo se descargaba 1,5 GB. Con los
# samples en Git LFS y sin rama `gh-pages`, el clon del repo baja ~8 MB.
#
# Requisitos (configuración del repo, se hace una vez):
#   Settings > Pages > Build and deployment > Source > "GitHub Actions"
#
#   CLI: gh api -X PUT /repos/ahuertam/akai25/pages -f build_type=workflow
#
# Ojo al verbo: es PUT, no PATCH (`PATCH /repos/{owner}/{repo}/pages` no
# existe y devuelve 404 Not Found).
# ---------------------------------------------------------------------------

# Disparamos en cada push a main y también manualmente desde la UI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` + `id-token: write` son los permisos que exige
# actions/deploy-pages. `contents: read` basta para el checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se ejecuten dos deploys concurrentes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # El environment es lo que ata el deployment al site de GitHub Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Los sample packs de public/samples/ están en Git LFS: sin esto el
          # checkout deja punteros en vez de los WAV y el build sube ficheros
          # de 130 bytes en lugar de audio.
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Construimos un .nojekyll vacío para que GH Pages no procese el
      # site con Jekyll (lo cual rompería directorios que empiezan por _).
      # También eliminamos cualquier CNAME previo por seguridad.
      - name: Prepare dist
        run: |
          touch dist/.nojekyll
          rm -f dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
