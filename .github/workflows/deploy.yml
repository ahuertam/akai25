name: Deploy to GitHub Pages

# Disparamos en cada push a main y también manualmente desde la UI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: write` es necesario para que el runner pueda hacer push a
# la rama `gh-pages` usando el GITHUB_TOKEN.
permissions:
  contents: write

# Evita que se ejecuten dos deploys concurrentes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Construimos un .nojekyll vacío para que GH Pages no procese el
      # site con Jekyll (lo cual rompería directorios que empiezan por _).
      # También eliminamos cualquier CNAME previo por seguridad.
      - name: Prepare dist
        run: |
          touch dist/.nojekyll
          rm -f dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # No mantener archivos antiguos: queremos un site limpio en cada deploy.
          keep_files: false
          # Identidad del commit generado.
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
